   <li>
      <app-customer-item [customerItem]=customer (customerDelete)="HandleDeleteCustomer($event)"
         class="flex items-center gap-2"></app-customer-item>
   </li>
   }
</ul>


<app-form (onAddCustomer)="addCustomer($event)" />
